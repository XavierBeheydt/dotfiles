#
# Picks which xdg-desktop-portal backend handles each interface under
# Hyprland (used by sandboxed/Flatpak apps; native apps talk to
# org.freedesktop.secrets on the session bus directly and ignore this).
#
# xdg-desktop-portal-hyprland doesn't implement the Secret interface,
# and oo7-portal (which does) ships with UseIn=gnome only -- so without
# this override, no backend would answer Secret portal requests here.
# `default` is restated (same value as the package's own
# hyprland-portals.conf) so this file is self-contained.
#
# xdg-desktop-portal:          https://flatpak.github.io/xdg-desktop-portal/docs/index.html
# xdg-desktop-portal-hyprland: https://wiki.hypr.land/hypr-ecosystem/user/xdg-desktop-portal-hyprland/
# oo7 (Secret portal backend): https://wiki.archlinux.org/title/Oo7

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=oo7-portal
