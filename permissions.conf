# path                                     owner     group     mode
#
# One entry per file/dir tracked in this repo. Generated/updated
# automatically by `dotfiles add <path>`.
#
#   path   is repo-relative and starts with etc/ or home/
#          (e.g. etc/nginx/nginx.conf, home/.ssh/config)
#   owner  and group are restored on both /etc and home targets by
#          bootstrap (as root for /etc, as your user for home)
#   mode   is restored the same way, as octal (e.g. 600, 644, 750)
#
# Files not listed here keep whatever mode git/the filesystem gives
# them (default 644, or 755 if the executable bit is set).
#
# Empty for now: home/.config and etc/ dotfiles are being re-added one
# at a time (see the Project board); each one gets its entry back via
# `dotfiles add <path>` as it's re-tracked.
